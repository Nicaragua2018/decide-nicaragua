# =============================================================
# Decide Nicaragua — Docker Compose de Producción
#
# Uso:
#   cp .env.example .env  # y completar con valores reales
#   docker compose up -d --build
#
# Variables requeridas en .env:
#   APP_DOMAIN, DATABASE_URL, REDIS_URL, JWT_SECRET,
#   APP_URL, API_URL, COOKIE_DOMAIN,
#   RESEND_API_KEY, EMAIL_FROM, IP_HASH_SALT,
#   TRAEFIK_ACME_EMAIL, TRAEFIK_DASHBOARD_PASSWORD
# =============================================================

services:

  # ── Traefik (reverse proxy + TLS) ─────────────────────────
  # Solo con TRAEFIK_MODO=propio (perfil traefik-propio). En el VPS compartido
  # con OpenCivic se usa el Traefik que ya existe (TRAEFIK_MODO=compartido).
  traefik:
    image: traefik:v2.11
    container_name: traefik
    profiles: ["traefik-propio"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # El email ACME se pasa como CLI flag porque traefik.yml no expande variables de entorno
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/letsencrypt
    networks:
      - decide_network
    labels:
      - "traefik.enable=true"
      # Dashboard — acceso con autenticación básica
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${APP_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_PASSWORD}"

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: decide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-decide}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - decide_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decide}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: decide_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - decide_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (NestJS) ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: decide_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-30d}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Decide Nicaragua}
      API_PORT: ${API_PORT:-4000}
      IP_HASH_SALT: ${IP_HASH_SALT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Asistente de IA (ADR-025): apagado salvo ASISTENTE_ACTIVO=true y con clave.
      ASISTENTE_ACTIVO: ${ASISTENTE_ACTIVO:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASISTENTE_TOPE_MENSUAL_USD: ${ASISTENTE_TOPE_MENSUAL_USD:-20}
      ASISTENTE_MODELO_RAPIDO: ${ASISTENTE_MODELO_RAPIDO:-claude-haiku-5-5}
      ASISTENTE_MODELO_CAPAZ: ${ASISTENTE_MODELO_CAPAZ:-claude-sonnet-5-5}
      ASISTENTE_AVISO_EMAIL: ${ASISTENTE_AVISO_EMAIL:-}
    networks:
      - decide_network
    labels:
      # Nombres con prefijo decide- para no chocar con otros sitios del mismo Traefik.
      - "traefik.enable=true"
      - "traefik.docker.network=decide_network"
      - "traefik.http.routers.decide-api.rule=Host(`api.${APP_DOMAIN}`)"
      - "traefik.http.routers.decide-api.entrypoints=websecure"
      - "traefik.http.routers.decide-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.decide-api.middlewares=decide-security@docker"
      - "traefik.http.routers.decide-api.service=decide-api"
      - "traefik.http.services.decide-api.loadbalancer.server.port=4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Web (Next.js) ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_API_URL: ${API_URL}
    container_name: decide_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_API_URL: ${API_URL}
    networks:
      - decide_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=decide_network"
      - "traefik.http.routers.decide-web.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.decide-web.entrypoints=websecure"
      - "traefik.http.routers.decide-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.decide-web.middlewares=decide-security@docker"
      - "traefik.http.routers.decide-web.service=decide-web"
      - "traefik.http.services.decide-web.loadbalancer.server.port=3000"
      # Cabeceras de seguridad (las mismas de infra/traefik/dynamic/security.yml),
      # definidas por etiqueta para que funcionen también con un Traefik compartido.
      - "traefik.http.middlewares.decide-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.decide-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.decide-security.headers.stsPreload=true"
      - "traefik.http.middlewares.decide-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.decide-security.headers.frameDeny=true"
      - "traefik.http.middlewares.decide-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.decide-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.decide-security.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()"
      - "traefik.http.middlewares.decide-security.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'none'; upgrade-insecure-requests"
      - "traefik.http.middlewares.decide-security.headers.customResponseHeaders.X-Powered-By="
      - "traefik.http.middlewares.decide-security.headers.customResponseHeaders.Server="

# ── Volúmenes persistentes ─────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  traefik_acme:

# ── Red interna ────────────────────────────────────────────────
networks:
  decide_network:
    name: decide_network
    driver: bridge
